services:
  - type: web
    name: shl-genai-recommender
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app:app --bind 0.0.0.0:10000
    envVars:
      - key: PORT
        value: 10000
    healthCheckPath: /health
